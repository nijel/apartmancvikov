name: Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version:
        - '3.11'
        - '3.12'
        - '3.13'
        - '3.14'
    name: Python ${{ matrix.python-version }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        enable-cache: true
        cache-suffix: ${{ matrix.python-version }}
    - run: sudo apt-get update
    - run: sudo apt-get install -y gettext
    - name: Install dependencies
      run: uv sync --locked --no-default-groups --group test
    - name: Compile MO files
      run: uv run --no-sync python manage.py compilemessages
    - name: Check responsive image variants
      run: uv run --no-sync python scripts/generate-images.py --check
    - name: Collect static files
      run: uv run --no-sync python manage.py collectstatic --noinput
    - name: Django checks
      run: uv run --no-sync python manage.py check
    - name: Test with Django
      run: uv run --no-sync coverage run manage.py test
    - name: Coverage
      run: |
        uv run --no-sync coverage combine
        uv run --no-sync coverage xml
    - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        name: Python ${{ matrix.python-version }}
