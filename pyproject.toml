[tool.djlint]
blank_line_after_tag = "load,extends,endblock"
ignore = "H014,T003,H006,H013,H031"
indent = 2
max_attribute_length = 80
max_blank_lines = 2
preserve_blank_lines = true
profile = "django"

[tool.isort]
profile = "black"

[tool.ruff.lint]
allowed-confusables = ["–"]
ignore = [
  "ANN",
  "S105",
  "PT",
  "TRY003",
  "EM101",
  "D211",
  "D212",
  "D100",
  "D104",
  "D105",
  "D203",  # CONFIG: incompatible with D211
  "E501",  # CONFIG: using formatter
  "ISC001",  # CONFIG: incompatible with formatter
  "COM",  # CONFIG: No trailing commas
  "D101"
]
select = ["ALL"]

[tool.ruff.lint.flake8-copyright]
min-file-size = 2
# Copyright without a year, see https://github.com/astral-sh/ruff/issues/10062
notice-rgx = "(?i)Copyright\\s+©\\s+"

[tool.ruff.lint.mccabe]
max-complexity = 16

[tool.ruff.lint.per-file-ignores]
"apartmancvikov//migrations/*.py" = ["RUF012"]
